name: Android CI (IronMind)

on:
  push:
    branches: [ "chore/gen-room-schema-v5-tmp" ]
    paths:
      - "IronMind/**"
      - ".github/workflows/android-ironmind.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IronMind
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate Room schema (KSP)
        run: ./gradlew :app:kspDebugKotlin --stacktrace

      - name: Dump generated Room schema JSON
        run: |
          find app/schemas -type f -name '*.json' | while read -r f; do
            echo "=== SCHEMA_FILE: $f ==="
            cat "$f"
            echo "=== END_SCHEMA_FILE ==="
          done
